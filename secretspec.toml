[project]
name = "voxnix"
revision = "1.0"

# ── eval profile ────────────────────────────────────────────────────────────
# Secrets needed for running LLM evals locally (just eval).
#
# OPENROUTER_API_KEY is the recommended single-key setup: it authenticates
# both the agent-under-test and the deepeval judge (via the OpenAI-compatible
# endpoint). Alternatively, set OPENAI_API_KEY if your test model is OpenAI.
#
# LLM_PROVIDER / LLM_MODEL are optional overrides; they default to
# openrouter / anthropic/claude-haiku-4.5 in conftest.py.
[profiles.eval]
OPENROUTER_API_KEY = { description = "OpenRouter API key — authenticates agent-under-test and deepeval judge", required = false }
OPENAI_API_KEY = { description = "OpenAI API key — alternative to OPENROUTER_API_KEY if using OpenAI directly", required = false }
LLM_PROVIDER = { description = "LLM provider for the agent-under-test (e.g. openrouter, anthropic, openai)", required = false, default = "openrouter" }
LLM_MODEL = { description = "Model name for the agent-under-test (e.g. anthropic/claude-haiku-4.5)", required = false, default = "anthropic/claude-haiku-4.5" }

# ── bot profile ──────────────────────────────────────────────────────────────
# Secrets needed for running the Telegram bot locally (just bot).
# Production equivalents live in agenix (secrets/agent-env.age) and are
# injected into the systemd service on the appliance — not managed here.
[profiles.bot]
TELEGRAM_BOT_TOKEN = { description = "Telegram bot token from @BotFather" }
TELEGRAM_ALLOWED_CHAT_IDS = { description = "JSON array of allowed Telegram chat IDs (e.g. [12345678])", required = false }
LLM_PROVIDER = { description = "LLM provider (anthropic, openai, openrouter)", default = "anthropic" }
LLM_MODEL = { description = "Model name (e.g. claude-sonnet-4-20250514)" }
ANTHROPIC_API_KEY = { description = "Anthropic API key", required = false }
OPENAI_API_KEY = { description = "OpenAI API key", required = false }
OPENROUTER_API_KEY = { description = "OpenRouter API key", required = false }
LOGFIRE_TOKEN = { description = "Logfire observability token", required = false }
VOXNIX_FLAKE_PATH = { description = "Absolute path to the voxnix flake on the appliance", required = false, default = "/var/lib/voxnix-agent/repo" }
